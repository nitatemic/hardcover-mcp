[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hardcover-mcp"
version = "0.1.1"
description = "MCP server for the Hardcover API — search books, manage your library, track reading progress and more."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["mcp", "hardcover", "books", "reading", "graphql"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
hardcover-mcp = "hardcover.server:main"

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/hardcover-mcp"
Issues = "https://github.com/YOUR_USERNAME/hardcover-mcp/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["hardcover"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
